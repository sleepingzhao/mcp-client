<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP 客户端</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230;
    --border: #2a2f3f; --text: #e6e8ee; --muted: #8b90a0;
    --accent: #4f8cff; --accent2: #3b6fd6; --ok: #3ecf8e; --err: #ff5d6c;
    --code-bg: #0b0d13; --error-bg: #2a1518;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f6f8; --panel: #ffffff; --panel2: #eef0f4;
    --border: #d9dde5; --text: #1f2329; --muted: #667085;
    --accent: #2563eb; --accent2: #1d4ed8; --ok: #059669; --err: #dc2626;
    --code-bg: #f8f9fb; --error-bg: #fef2f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .badge.on { color: var(--ok); border-color: var(--ok); }
  .badge.off { color: var(--muted); }
  .badge.err { color: var(--err); border-color: var(--err); }
  .badge.connecting { color: var(--accent); border-color: var(--accent); }
  .icon-btn { width: 34px; height: 34px; padding: 0; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
  #profileBtn {
    min-width: 110px; max-width: 200px; width: auto;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 13px;
    text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .dropdown { position: relative; }
  .manage-panel {
    position: absolute; right: 0; top: 42px; z-index: 100;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; width: 280px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    display: flex; flex-direction: column; gap: 8px;
  }
  .manage-title { font-size: 12px; font-weight: 600; color: var(--muted); }
  .manage-item {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border);
  }
  .manage-item.active { border-color: var(--accent); }
  .manage-item .mname { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .manage-item .cur-mark { color: var(--ok); font-size: 12px; font-weight: 600; }
  .mname-edit {
    flex: 1; min-width: 0; background: var(--panel2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 4px; padding: 3px 6px; font-size: 13px;
  }
  .manage-item button { width: 26px; height: 26px; padding: 0; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
  .add-btn { width: 100%; justify-content: center; }
  .manage-save { display: flex; gap: 6px; align-items: center; }
  .manage-save input {
    flex: 1; min-width: 0; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  .manage-save button { flex-shrink: 0; white-space: nowrap; }
  #errorBanner {
    background: var(--error-bg); color: var(--err); border-bottom: 1px solid var(--err);
    padding: 10px 16px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  #errorBanner .err-title { font-weight: 600; margin-bottom: 2px; }
  button {
    cursor: pointer; border: 1px solid var(--border); background: var(--panel2);
    color: var(--text); padding: 7px 13px; border-radius: 8px; font-size: 13px; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent2); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  /* 去掉焦点黑框, 用边框色变化表示焦点 */
  button:focus, button:focus-visible, select:focus, select:focus-visible,
  input:focus, input:focus-visible, textarea:focus, textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
  }
  .spacer { flex: 1; }
  main { flex: 1; display: flex; overflow: hidden; }
  .sidebar {
    width: 320px; min-width: 260px; border-right: 1px solid var(--border);
    background: var(--panel); overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .config { display: flex; flex-direction: column; gap: 8px; }
  .config label { font-size: 12px; color: var(--muted); }
  .config input, .config textarea, .config select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 13px;
  }
  .tool-item {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    cursor: pointer; transition: background .12s;
  }
  .tool-item:hover { background: var(--panel2); }
  .tool-item.active { border-color: var(--accent); background: var(--panel2); }
  .tool-item .tname { font-weight: 600; font-size: 14px; }
  .tool-item .tdesc { font-size: 12px; color: var(--muted); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .content { flex: 1; overflow-y: auto; padding: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 15px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .req { color: var(--err); }
  pre.result {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.5;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
  }
  .muted { color: var(--muted); }
  .err-text { color: var(--err); }
  .ok-text { color: var(--ok); }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🛠️ MCP 客户端</h1>
  <span id="statusBadge" class="badge off">未连接</span>
  <div class="spacer"></div>
  <div class="dropdown">
    <button id="profileBtn" onclick="toggleManagePanel()" title="切换/管理配置">配置</button>
    <div id="managePanel" class="manage-panel" style="display:none">
      <div id="manageList"></div>
      <button class="add-btn" onclick="addProfile()">➕ 新增配置</button>
    </div>
  </div>
  <button class="icon-btn" id="btnTheme" onclick="toggleTheme()" title="切换明暗主题">🌙</button>
  <button id="btnRefresh" onclick="refreshTools()" disabled>刷新</button>
</header>

<div id="errorBanner" style="display:none"></div>

<main>
  <aside class="sidebar">
    <div class="config">
      <label>连接方式</label>
      <select id="mode" onchange="onModeChange()">
        <option value="stdio">stdio (本地命令)</option>
        <option value="http">HTTP / SSE (远程 URL)</option>
      </select>

      <div id="stdioFields">
        <label>命令</label>
        <input id="command" placeholder="npx / uvx / python ..." value="npx">
        <label>参数 (每行一个)</label>
        <textarea id="args" rows="3" placeholder="-y&#10;@modelcontextprotocol/server-filesystem&#10;."></textarea>
      </div>

      <div id="httpFields" style="display:none">
        <label>URL</label>
        <input id="url" placeholder="https://host/mcp">
        <label>传输类型</label>
        <select id="transport">
          <option value="streamable_http">streamable_http</option>
          <option value="sse">sse</option>
        </select>
        <label>鉴权 Headers (每行一个, 格式: 名称: 值)</label>
        <textarea id="headers" rows="3" placeholder="Authorization: Bearer sk-xxx&#10;X-Api-Key: your-key"></textarea>
      </div>

      <button class="primary" id="btnConnect" onclick="connectMCP()">连接</button>
      <button id="btnSaveCurrent" onclick="saveConfig()" title="把当前表单保存到选中的配置">💾 保存</button>
    </div>

    <div class="hint" id="toolCount"></div>
    <div id="toolList"></div>
  </aside>

  <section class="content" id="content">
    <div class="card">
      <h2>使用说明</h2>
      <p class="muted">
        1. 左侧填写连接配置，点击「连接」。<br>
        2. 连接成功后左侧加载 Tools 列表，点击某个 Tool 查看详情。<br>
        3. 填写参数后点击「执行」，结果显示在下方。<br>
        4. 顶栏可切换 / 保存 / 删除已保存的配置。
      </p>
    </div>
  </section>
</main>

<script>
let tools = [];
let currentTool = null;
let currentProfileName = null;   // 当前正在使用的配置名

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  return data;
}

// ---------- 主题切换 ----------
function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('mcp_theme', next);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('btnTheme').textContent = theme === 'dark' ? '🌙' : '☀️';
}

// ---------- 连接配置 ----------
function onModeChange() {
  const mode = document.getElementById('mode').value;
  document.getElementById('stdioFields').style.display = mode === 'stdio' ? '' : 'none';
  document.getElementById('httpFields').style.display = mode === 'http' ? '' : 'none';
}

function collectConfig() {
  const mode = document.getElementById('mode').value;
  const cfg = { mode };
  if (mode === 'stdio') {
    cfg.command = document.getElementById('command').value.trim();
    cfg.args = document.getElementById('args').value.split('\n').map(s => s.trim()).filter(Boolean);
  } else {
    cfg.url = document.getElementById('url').value.trim();
    cfg.transport = document.getElementById('transport').value;
    const headers = {};
    document.getElementById('headers').value.split('\n').forEach(line => {
      const idx = line.indexOf(':');
      if (idx > 0) {
        const k = line.slice(0, idx).trim();
        const v = line.slice(idx + 1).trim();
        if (k) headers[k] = v;
      }
    });
    cfg.headers = headers;
  }
  return cfg;
}

function applyConfig(cfg) {
  if (!cfg) return;
  if (cfg.mode) document.getElementById('mode').value = cfg.mode;
  if (cfg.command != null) document.getElementById('command').value = cfg.command;
  if (Array.isArray(cfg.args)) document.getElementById('args').value = cfg.args.join('\n');
  if (cfg.url != null) document.getElementById('url').value = cfg.url;
  if (cfg.transport) document.getElementById('transport').value = cfg.transport;
  if (cfg.headers && typeof cfg.headers === 'object') {
    document.getElementById('headers').value = Object.entries(cfg.headers)
      .map(([k, v]) => `${k}: ${v}`).join('\n');
  }
  onModeChange();
}

async function connectMCP() {
  const cfg = collectConfig();
  if (cfg.mode === 'stdio') {
    if (!cfg.command) { alert('请填写命令'); return; }
  } else {
    if (!cfg.url) { alert('请填写 URL'); return; }
  }
  const { mode, ...payload } = cfg;

  setStatus('connecting', '连接中...');
  setConnecting(true);
  hideError();
  try {
    const data = await api('/api/connect', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
    });
    if (data.ok) {
      setStatus('on', '已连接');
      await refreshTools();
    } else {
      setStatus('err', '连接失败');
      showError('连接失败', data.error || '未知错误');
    }
  } catch (e) {
    setStatus('err', '连接失败');
    showError('连接失败', e.message || String(e));
  } finally {
    setConnecting(false);
  }
}

function setConnecting(busy) {
  document.getElementById('btnConnect').disabled = busy;
  document.getElementById('btnConnect').textContent = busy ? '连接中...' : '连接';
}

function showError(title, detail) {
  const el = document.getElementById('errorBanner');
  el.innerHTML = `<div class="err-title">⚠ ${escapeHtml(title)}</div><div>${escapeHtml(detail)}</div>`;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('errorBanner').style.display = 'none';
}

// ---------- Profile 管理 ----------
function toggleManagePanel() {
  const p = document.getElementById('managePanel');
  const show = p.style.display === 'none';
  p.style.display = show ? 'flex' : 'none';
  if (show) renderManageList();
}

async function renderManageList() {
  const data = await api('/api/profiles');
  const el = document.getElementById('manageList');
  el.innerHTML = '';
  const names = data.ok ? Object.keys(data.profiles || {}) : [];

  // 更新顶栏按钮文字为当前配置名
  const btn = document.getElementById('profileBtn');
  btn.textContent = (currentProfileName || '选择配置');

  if (!names.length) {
    el.innerHTML = '<div class="hint">无已保存配置</div>';
    return;
  }
  names.forEach((n, i) => {
    const div = document.createElement('div');
    div.className = 'manage-item' + (n === currentProfileName ? ' active' : '');

    const nameEl = document.createElement('span');
    nameEl.className = 'mname';
    nameEl.textContent = n;
    nameEl.title = n;
    nameEl.onclick = () => { if (n !== currentProfileName) loadProfile(n); };
    div.appendChild(nameEl);

    // 当前配置标记
    if (n === currentProfileName) {
      const check = document.createElement('span');
      check.className = 'cur-mark';
      check.textContent = '✓';
      div.appendChild(check);
    }

    const btnUp = document.createElement('button');
    btnUp.textContent = '↑';
    btnUp.title = '上移';
    btnUp.disabled = i === 0;
    btnUp.onclick = () => moveProfile(i, i - 1);
    div.appendChild(btnUp);

    const btnDown = document.createElement('button');
    btnDown.textContent = '↓';
    btnDown.title = '下移';
    btnDown.disabled = i === names.length - 1;
    btnDown.onclick = () => moveProfile(i, i + 1);
    div.appendChild(btnDown);

    const btnRename = document.createElement('button');
    btnRename.textContent = '✏️';
    btnRename.title = '重命名';
    btnRename.onclick = () => startEdit(div, nameEl, n);
    div.appendChild(btnRename);

    const btnDel = document.createElement('button');
    btnDel.textContent = '🗑';
    btnDel.title = '删除';
    btnDel.onclick = () => deleteConfig(n);
    div.appendChild(btnDel);

    el.appendChild(div);
  });
}

// 内联编辑: 把配置名替换成输入框, Enter 确认重命名, Esc/失焦取消
function startEdit(itemDiv, nameEl, oldName) {
  const input = document.createElement('input');
  input.value = oldName;
  input.className = 'mname-edit';
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const commit = async () => {
    if (done) return;
    done = true;
    const newName = input.value.trim();
    if (newName && newName !== oldName) {
      await renameConfig(oldName, newName);
    } else {
      await renderManageList();
    }
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { done = true; renderManageList(); }
  });
  input.addEventListener('blur', commit);
}

// 定位管理面板里指定名称的配置项并进入编辑
function focusEditProfile(name) {
  const items = document.querySelectorAll('.manage-item');
  for (const item of items) {
    const nameEl = item.querySelector('.mname');
    if (nameEl && nameEl.textContent === name) {
      startEdit(item, nameEl, name);
      return;
    }
  }
}

function clearForm() {
  document.getElementById('mode').value = 'stdio';
  document.getElementById('command').value = 'npx';
  document.getElementById('args').value = '';
  document.getElementById('url').value = '';
  document.getElementById('transport').value = 'streamable_http';
  document.getElementById('headers').value = '';
  onModeChange();
}

function clearTools() {
  tools = [];
  currentTool = null;
  document.getElementById('toolCount').textContent = '';
  document.getElementById('toolList').innerHTML = '';
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h2>使用说明</h2>
      <p class="muted">
        1. 左侧填写连接配置，点击「连接」。<br>
        2. 连接成功后左侧加载 Tools 列表，点击某个 Tool 查看详情。<br>
        3. 填写参数后点击「执行」，结果显示在下方。
      </p>
    </div>`;
  setStatus('off', '未连接');
  hideError();
}

async function addProfile() {
  // 生成不重名的"未命名"配置名
  const data = await api('/api/profiles');
  const existing = data.ok ? Object.keys(data.profiles || {}) : [];
  let name = '未命名';
  let i = 1;
  while (existing.includes(name)) {
    i++;
    name = '未命名' + i;
  }
  // 用空配置创建
  const cfg = { mode: 'stdio', command: 'npx', args: [] };
  const r = await api('/api/profiles', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name, config: cfg })
  });
  if (r.ok) {
    currentProfileName = name;
    await refreshProfiles();
    // 清空侧栏表单和已展示的 tools
    clearForm();
    clearTools();
    // 打开管理面板, 焦点落在新配置名称上以便直接重命名
    document.getElementById('managePanel').style.display = 'flex';
    focusEditProfile(name);
  } else {
    alert('新增失败: ' + (r.error || '未知错误'));
  }
}

async function saveConfig() {
  const name = currentProfileName;
  if (!name) { alert('请先在顶栏选择或新增一个配置'); return; }
  const cfg = collectConfig();
  const data = await api('/api/profiles', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name, config: cfg })
  });
  if (data.ok) {
    await refreshProfiles();
    alert('已保存到配置: ' + name);
  } else {
    alert('保存失败: ' + (data.error || '未知错误'));
  }
}

async function deleteConfig(name) {
  if (!confirm('确定删除配置 "' + name + '" ?')) return;
  const data = await api('/api/profiles/' + encodeURIComponent(name), { method: 'DELETE' });
  if (data.ok) {
    const wasCurrent = currentProfileName === name;
    currentProfileName = data.active || null;
    await refreshProfiles();
    if (wasCurrent) {
      // 删的是当前配置: 加载回退的 active 配置, 或清空
      if (currentProfileName) {
        await loadProfile(currentProfileName);
      } else {
        clearForm();
        clearTools();
      }
    }
  } else {
    alert('删除失败: ' + (data.error || '未知错误'));
  }
}

async function renameConfig(oldName, newName) {
  if (!oldName || !newName || newName.trim() === oldName) return;
  const data = await api('/api/profiles/rename', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ old: oldName, new: newName.trim() })
  });
  if (data.ok) {
    if (currentProfileName === oldName) {
      currentProfileName = newName.trim();
    }
    await refreshProfiles();
  } else {
    alert('重命名失败: ' + (data.error || '未知错误'));
  }
}

async function moveProfile(from, to) {
  const data = await api('/api/profiles');
  if (!data.ok) return;
  const names = Object.keys(data.profiles || {});
  if (from < 0 || to < 0 || from >= names.length || to >= names.length) return;
  [names[from], names[to]] = [names[to], names[from]];
  const r = await api('/api/profiles/reorder', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ names })
  });
  if (r.ok) {
    await refreshProfiles();
  } else {
    alert('排序失败: ' + (r.error || '未知错误'));
  }
}

async function refreshProfiles() {
  // 下拉框已合并进管理面板, 只需刷新面板列表和顶栏按钮文字
  await renderManageList();
}

// 加载指定配置: 填充表单, 有真实参数则连接, 否则清空 tools
async function loadProfile(name) {
  const data = await api('/api/profiles');
  if (!data.ok || !data.profiles || !data.profiles[name]) {
    return false;
  }
  const cfg = data.profiles[name];
  currentProfileName = name;
  applyConfig(cfg);

  const hasValid = cfg.mode === 'stdio'
    ? !!(cfg.command && cfg.command.trim())
    : !!(cfg.url && cfg.url.trim());

  if (hasValid) {
    await connectMCP();
  } else {
    clearTools();
  }
  await api('/api/profiles/activate', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name })
  });
  await refreshProfiles();
  return true;
}

// ---------- Tools ----------
async function refreshTools() {
  const data = await api('/api/tools', { method: 'POST' });
  if (!data.ok) {
    document.getElementById('toolCount').textContent = '加载失败: ' + data.error;
    return;
  }
  tools = data.tools || [];
  document.getElementById('toolCount').textContent = `共 ${tools.length} 个 tools`;
  renderToolList();
}

function renderToolList() {
  const el = document.getElementById('toolList');
  el.innerHTML = '';
  tools.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tool-item' + (currentTool && currentTool.name === t.name ? ' active' : '');
    div.innerHTML = `<div class="tname">${escapeHtml(t.name)}</div>
      <div class="tdesc">${escapeHtml(t.description || '')}</div>`;
    div.onclick = () => selectTool(t);
    el.appendChild(div);
  });
}

function selectTool(t) {
  currentTool = t;
  renderToolList();
  renderDetail(t);
}

// 根据 JSON schema 渲染单个参数字段
function renderField(name, schema, isReq) {
  const type = schema.type || 'string';
  const desc = schema.description || '';
  const reqMark = isReq ? '<span class="req">必填</span>' : '可选';
  const escName = escapeHtml(name);
  const escDesc = escapeHtml(desc);

  if (Array.isArray(schema.enum) && schema.enum.length) {
    const opts = schema.enum.map(v =>
      `<option value="${escapeHtml(String(v))}">${escapeHtml(String(v))}</option>`
    ).join('');
    return `<div class="field">
      <label>${escName} <span class="hint">(${type}, ${reqMark})</span></label>
      <select data-name="${escName}" data-type="${escapeHtml(type)}">${opts}</select>
    </div>`;
  }

  if (type === 'boolean') {
    const def = schema.default === true ? 'true' : (schema.default === false ? 'false' : 'true');
    return `<div class="field">
      <label>${escName} <span class="hint">(boolean, ${reqMark})</span></label>
      <select data-name="${escName}" data-type="boolean">
        <option value="true"${def === 'true' ? ' selected' : ''}>true</option>
        <option value="false"${def === 'false' ? ' selected' : ''}>false</option>
      </select>
    </div>`;
  }

  if (type === 'number' || type === 'integer') {
    const def = schema.default != null ? ` value="${escapeHtml(String(schema.default))}"` : '';
    return `<div class="field">
      <label>${escName} <span class="hint">(${type}, ${reqMark})</span></label>
      <input type="number" step="${type === 'integer' ? '1' : 'any'}" data-name="${escName}" data-type="${escapeHtml(type)}" placeholder="${escDesc}"${def}>
    </div>`;
  }

  if (type === 'array' || type === 'object') {
    const itemsType = schema.items && schema.items.type ? schema.items.type : null;
    const def = schema.default != null ? escapeHtml(JSON.stringify(schema.default)) : '';
    const itemsAttr = itemsType ? ` data-items-type="${escapeHtml(itemsType)}"` : '';
    return `<div class="field">
      <label>${escName} <span class="hint">(${type}, ${reqMark})</span></label>
      <textarea data-name="${escName}" data-type="${escapeHtml(type)}"${itemsAttr} rows="3" placeholder="${escDesc}">${def}</textarea>
    </div>`;
  }

  const def = schema.default != null ? ` value="${escapeHtml(String(schema.default))}"` : '';
  return `<div class="field">
    <label>${escName} <span class="hint">(${type}, ${reqMark})</span></label>
    <input data-name="${escName}" data-type="string" placeholder="${escDesc}"${def}>
  </div>`;
}

// 根据类型把输入值转换为正确的 JS 类型
function coerceValue(raw, type, itemsType) {
  switch (type) {
    case 'boolean':
      return raw === 'true';
    case 'number':
      return Number(raw);
    case 'integer':
      return parseInt(raw, 10);
    case 'array':
      try {
        return JSON.parse(raw);
      } catch (e) {
        return looseArray(raw, itemsType);
      }
    case 'object':
      try {
        return JSON.parse(raw);
      } catch (e) {
        throw new Error(`需为合法 JSON 对象, 例如 {"key": "value"} (当前: ${raw})`);
      }
    case 'string':
    default:
      return raw;
  }
}

function looseArray(raw, itemsType) {
  let s = raw.trim();
  if (s.startsWith('[') && s.endsWith(']')) s = s.slice(1, -1);
  if (!s.trim()) return [];
  return s.split(',').map(x => {
    x = x.trim();
    if ((x.startsWith('"') && x.endsWith('"')) || (x.startsWith("'") && x.endsWith("'"))) {
      x = x.slice(1, -1);
    }
    if (itemsType === 'number') return Number(x);
    if (itemsType === 'integer') return parseInt(x, 10);
    if (itemsType === 'boolean') return x === 'true';
    return x;
  });
}

function renderDetail(t) {
  const props = (t.input_schema && t.input_schema.properties) || {};
  const required = new Set((t.input_schema && t.input_schema.required) || []);
  let fieldsHtml = '';
  for (const [name, schema] of Object.entries(props)) {
    fieldsHtml += renderField(name, schema, required.has(name));
  }
  if (!fieldsHtml) {
    fieldsHtml = '<div class="hint">该 tool 无参数</div>';
  }
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h2>${escapeHtml(t.name)}</h2>
      <p class="muted">${escapeHtml(t.description || '')}</p>
    </div>
    <div class="card">
      <h2>参数</h2>
      ${fieldsHtml}
      <button class="primary" onclick="executeTool()">执行</button>
    </div>
    <div class="card">
      <h2>结果</h2>
      <pre class="result" id="result">（尚未执行）</pre>
    </div>`;
}

async function executeTool() {
  if (!currentTool) return;
  const props = (currentTool.input_schema && currentTool.input_schema.properties) || {};
  const required = new Set((currentTool.input_schema && currentTool.input_schema.required) || []);
  const arguments_ = {};

  const fields = document.querySelectorAll('[data-name]');
  for (const el of fields) {
    const name = el.getAttribute('data-name');
    const type = el.getAttribute('data-type') || 'string';
    const itemsType = el.getAttribute('data-items-type') || undefined;
    const raw = el.value.trim();
    if (raw === '') {
      if (required.has(name)) {
        document.getElementById('result').textContent = `错误: 必填参数 "${name}" 未填写`;
        document.getElementById('result').className = 'result err-text';
        return;
      }
      continue;
    }
    try {
      arguments_[name] = coerceValue(raw, type, itemsType);
    } catch (e) {
      document.getElementById('result').textContent = `参数 "${name}" 错误: ${e.message}`;
      document.getElementById('result').className = 'result err-text';
      return;
    }
  }

  const el = document.getElementById('result');
  el.textContent = '执行中...';
  el.className = 'result';
  const data = await api('/api/call', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name: currentTool.name, arguments: arguments_ })
  });
  if (!data.ok) {
    el.textContent = '错误: ' + (data.error || '未知错误');
    el.className = 'result err-text';
    return;
  }
  const pretty = JSON.stringify(data.result, null, 2);
  el.textContent = pretty;
  el.className = 'result ' + (data.result.isError ? 'err-text' : '');
}

function setStatus(cls, text) {
  const b = document.getElementById('statusBadge');
  b.className = 'badge ' + cls;
  b.textContent = text;
  document.getElementById('btnRefresh').disabled = cls !== 'on';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

async function init() {
  const savedTheme = localStorage.getItem('mcp_theme') || 'dark';
  applyTheme(savedTheme);

  const data = await api('/api/profiles');
  if (data.ok && data.active) {
    currentProfileName = data.active;
  }
  await refreshProfiles();

  if (data.ok && data.active && data.profiles && data.profiles[data.active]) {
    // 有激活的 profile: 优先加载它 (填充表单 + 重新连接)
    await loadProfile(data.active);
  } else {
    // 无 profile: 尝试恢复命令行启动的连接
    const cur = await api('/api/current-config');
    if (cur.ok && cur.config) {
      applyConfig(cur.config);
    }
    const status = await api('/api/status');
    if (status.connected) {
      setStatus('on', '已连接');
      await refreshTools();
    }
  }
}

// 点击管理面板/⚙️ 按钮之外的区域时, 自动关闭管理面板
document.addEventListener('click', (e) => {
  const panel = document.getElementById('managePanel');
  const btn = document.getElementById('profileBtn');
  if (panel && panel.style.display !== 'none') {
    if (!panel.contains(e.target) && (!btn || !btn.contains(e.target))) {
      panel.style.display = 'none';
    }
  }
});

init();
</script>
